<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening LLM Gateway</title>
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0a0b; color: #a8a8af; font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: #7aa2ff; }
  @media (prefers-color-scheme: light) { body { background: #f5f6f9; color: #4d5668; } a { color: #2f5bd3; } }
</style>
</head>
<body>
<p id="msg">Opening LLM Gateway…</p>
<script>
// LLM Gateway opens this page on its first start (#port=…). It goes straight on to the app's own dashboard on this
// computer, taking the access key added on the download page (kept in this browser) along after the #, so the key
// never reaches a server. With no key, it just opens the dashboard.
(() => {
  const port = Number((/(?:^#|&)port=(\d{2,5})/.exec(location.hash) || [])[1]) || 8090;
  let key = "";
  try { key = localStorage.getItem("llmgw-access-key") || ""; } catch (e) {}
  const to = `http://127.0.0.1:${port}/` + (/^[2-9A-HJ-NP-Z]{5}(-[2-9A-HJ-NP-Z]{5}){3}$/.test(key) ? `#key=${key}` : "");
  document.getElementById("msg").innerHTML = `Opening LLM Gateway… <a href="http://127.0.0.1:${port}/">Open it</a> if nothing happens.`;
  location.replace(to);
})();
</script>
</body>
</html>
